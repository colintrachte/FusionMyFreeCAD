name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The add-on claims Windows, macOS, and Linux support, so all three are
    # exercised. Path separators and filesystem case sensitivity differ between
    # them, and only Linux catches a case-wrong bundled filename.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install tooling
        run: python -m pip install --upgrade -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Check tracked files for private machine details and secrets
        run: python tools/check_repository_privacy.py

      - name: Validate behavior-sensitive command mappings
        run: python tools/validate_layout_contracts.py

      # ruff's extend-exclude skips bundled-addons/, so edits to the vendored
      # ribbon and search payload are otherwise never linted -- that is how an
      # undefined QPoint reached a release and left FreeCAD with a blank window.
      # Undefined names only: upstream style is not ours to police, but a name
      # that does not exist is a crash wherever that line runs. Qt Designer
      # output and .pyi stubs carry forward references that are fine at runtime.
      - name: Lint the bundled payload for undefined names
        run: ruff check --isolated --select F821 --exclude '*.pyi' --exclude '*_ui.py' bundled-addons/

      - name: Test
        run: python -m pytest tests -q

      - name: Build the add-on archive
        run: python tools/build_addon_package.py

      - name: Upload the archive
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: fmf-addon
          path: dist/*.zip

  package-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Refuse binaries and build output in the tracked tree
        run: |
          set -euo pipefail
          offenders=$(git ls-files | grep -Ei '\.(exe|pdb|dll|pyc|zip)$' || true)
          if [ -n "$offenders" ]; then
            echo "Binary artefacts must not be tracked:"
            echo "$offenders"
            exit 1
          fi

      - name: Warn on large tracked files
        run: |
          set -euo pipefail
          # Addon Manager clones this repository, so tracked weight is user cost.
          large=$(git ls-files -z \
            | xargs -0 -I{} sh -c 'test -f "{}" && printf "%s %s\n" "$(wc -c < "{}")" "{}"' \
            | awk '$1 > 1048576 {print}' | sort -rn || true)
          if [ -n "$large" ]; then
            echo "::warning::Tracked files over 1 MiB:"
            echo "$large"
          fi
