        stroke-linejoin="round" />
  <path d="M12 26 L12 40 L28 48 L28 34 Z" fill="#729fcf" stroke="#204a87" stroke-width="2"
        stroke-linejoin="round" />
  <path d="M44 26 L44 40 L28 48 L28 34 Z" fill="#5a8ac0" stroke="#204a87" stroke-width="2"
        stroke-linejoin="round" />

  <!-- The change coming back round to everything below it. -->
  <path d="M50 14 A18 18 0 1 1 22 10" fill="none" stroke="url(#arrowGrad)" stroke-width="5"
        stroke-linecap="round" />
  <path d="M50 4 L52 16 L40 15 Z" fill="#4e9a06" />
