<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="slotGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#729fcf" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#204a87" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- Slot outer boundary -->
  <rect x="10" y="20" width="44" height="24" rx="12" ry="12" fill="url(#slotGrad)" stroke="#204a87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center-to-center dashed construction centerline -->
  <line x1="22" y1="32" x2="42" y2="32" stroke="#3465a4" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4,3" />

  <!-- Center points of end arcs -->
  <circle cx="22" cy="32" r="3.5" fill="#8ae234" stroke="#4e9a06" stroke-width="1.5" />
  <circle cx="42" cy="32" r="3.5" fill="#8ae234" stroke="#4e9a06" stroke-width="1.5" />
</svg>
