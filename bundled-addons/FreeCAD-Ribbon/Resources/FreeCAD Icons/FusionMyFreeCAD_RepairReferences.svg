<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="linkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#729fcf" />
      <stop offset="100%" stop-color="#204a87" />
    </linearGradient>
    <linearGradient id="mendGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8ae234" />
      <stop offset="100%" stop-color="#4e9a06" />
    </linearGradient>
  </defs>

  <!-- A broken chain: two links that no longer meet. The gap is the subject. -->
  <path d="M26 20 L18 12 A9 9 0 0 0 6 24 L12 30"
        fill="none" stroke="url(#linkGrad)" stroke-width="6" stroke-linecap="round" />
  <path d="M38 44 L46 52 A9 9 0 0 0 58 40 L52 34"
        fill="none" stroke="url(#linkGrad)" stroke-width="6" stroke-linecap="round" />

  <!-- The severed ends, drawn short and blunt so the break reads at 16px. -->
  <line x1="22" y1="30" x2="28" y2="36" stroke="#ef2929" stroke-width="5" stroke-linecap="round" />
  <line x1="36" y1="28" x2="42" y2="34" stroke="#ef2929" stroke-width="5" stroke-linecap="round" />

  <!-- Mended: the tick says this command puts it back, not just finds it. -->
  <circle cx="48" cy="16" r="10" fill="url(#mendGrad)" stroke="#204a87" stroke-width="1.5" />
  <polyline points="43,16 47,20 53,12" fill="none" stroke="#ffffff" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round" />
</svg>
