<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="offGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#729fcf" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3465a4" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Outer offset contour -->
  <rect x="8" y="8" width="48" height="48" rx="8" fill="url(#offGrad)" stroke="#204a87" stroke-width="3" stroke-linecap="round" />

  <!-- Inner base contour -->
  <rect x="20" y="20" width="24" height="24" rx="4" fill="#ffffff" fill-opacity="0.8" stroke="#2e3436" stroke-width="2.5" stroke-linecap="round" />

  <!-- Offset dimension arrow -->
  <line x1="44" y1="32" x2="56" y2="32" stroke="#cc0000" stroke-width="2" stroke-linecap="round" />
  <polyline points="53,29 56,32 53,35" fill="none" stroke="#cc0000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="47,29 44,32 47,35" fill="none" stroke="#cc0000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
